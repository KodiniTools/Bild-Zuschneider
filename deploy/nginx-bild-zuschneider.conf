# ================================================================
# BILD-ZUSCHNEIDER (Static SPA, kein Backend) – /bild-zuschneider/
# ================================================================
# Quelle: KodiniTools/Bild-Zuschneider, deploy/nginx-bild-zuschneider.conf
# Installiert als /etc/nginx/snippets/bild-zuschneider.conf und im
# server{}-Block von kodinitools.com eingebunden mit:
#   include /etc/nginx/snippets/bild-zuschneider.conf;
# (deploy/server-setup.sh erledigt beides.)
#
# Aufbau wie der Texteditor (Vite-SPA): Assets mit Content-Hash lange cachen,
# index.html kurz, History-Routen (/guide, /faq, /about) fallen auf index.html
# zurück. SSI (Nav/Footer/Cookie-Banner) und Heartbeat kommen vom server{}-Block.
# Kein COOP/COEP: die App braucht weder SharedArrayBuffer noch Worker.

# Ohne Schrägstrich -> mit Schrägstrich (Vite-base ist /bild-zuschneider/)
location = /bild-zuschneider {
    return 301 /bild-zuschneider/;
}

# Versteckte Dateien (z. B. .deployed mit dem Commit-Stand) nicht ausliefern
location ^~ /bild-zuschneider/. {
    return 404;
}

# Vite-Assets mit Content-Hash im Dateinamen -> 1 Jahr immutable
location ^~ /bild-zuschneider/assets/ {
    alias /var/www/kodinitools.com/bild-zuschneider/assets/;
    add_header Cache-Control          "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff"                             always;
    access_log off;
    try_files $uri =404;
}

# SPA: index.html kurz cachen, History-Routen auf index.html zurückfallen
location ^~ /bild-zuschneider/ {
    alias /var/www/kodinitools.com/bild-zuschneider/;
    index index.html;

    # add_header in dieser location überschreibt die Server-Header -> erneut einbinden
    include /etc/nginx/snippets/kodini-security.conf;

    add_header Cache-Control          "public, max-age=60, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff"                             always;

    try_files $uri $uri/ /bild-zuschneider/index.html;
}
